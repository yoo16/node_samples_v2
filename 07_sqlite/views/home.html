<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home · Node SQLite</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-white text-neutral-900 antialiased">
  <div id="header"></div>
  <main class="mx-auto max-w-3xl px-4 py-10">
    <div class="mb-12">
      <p class="mb-3 text-sm font-medium text-neutral-400">Express · SQLite · Tailwind CSS</p>
      <h1 class="text-4xl font-semibold tracking-tight">Node.js + SQLite sample</h1>
      <p class="mt-4 max-w-xl text-neutral-500">サーバー不要のファイルDB。<code class="rounded bg-neutral-100 px-1.5 py-0.5 text-sm">node:sqlite</code> で SELECT / INSERT / DELETE / JOIN / トランザクション / SQLインジェクションを体験します。</p>
    </div>
    <div class="grid gap-4 sm:grid-cols-3">
      <a href="/feeds" class="group rounded-xl border border-neutral-200 p-5 transition hover:border-neutral-900">
        <h2 class="font-medium">Feeds <span class="inline-block text-neutral-400 transition group-hover:translate-x-0.5">→</span></h2>
        <p class="mt-1 text-sm text-neutral-500">投稿・削除・JOIN</p>
      </a>
      <a href="/users" class="group rounded-xl border border-neutral-200 p-5 transition hover:border-neutral-900">
        <h2 class="font-medium">Users <span class="inline-block text-neutral-400 transition group-hover:translate-x-0.5">→</span></h2>
        <p class="mt-1 text-sm text-neutral-500">ユーザー一覧</p>
      </a>
      <a href="/sql-client" class="group rounded-xl border border-neutral-200 p-5 transition hover:border-neutral-900">
        <h2 class="font-medium">SQL Client <span class="inline-block text-neutral-400 transition group-hover:translate-x-0.5">→</span></h2>
        <p class="mt-1 text-sm text-neutral-500">SQLと結果を確認</p>
      </a>
    </div>
  </main>
  <script type="module" src="/js/layout.js"></script>
</body>
</html>
