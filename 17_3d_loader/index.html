<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Model Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 overflow-hidden">
  <div class="absolute top-4 left-4 z-50">
    <div class="bg-white/80 backdrop-blur-md p-4 rounded-xl shadow-2xl border border-white/20 w-64">
      <h1 class="text-gray-800 text-sm font-bold mb-2 flex items-center gap-2">
        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
        MODEL SELECTOR
      </h1>

      <div class="relative">
        <select id="model-select"
          class="w-full bg-white border border-gray-300 text-gray-700 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 appearance-none cursor-pointer hover:bg-gray-50 transition-colors">
          <option value="/models/model_idle.fbx">モーション: Idle</option>
          <option value="/models/model_attack.fbx">モーション: Attack</option>
          <option value="/models/model_damage.fbx">モーション: Damage</option>
          <option value="/models/model_death.fbx">モーション: Death</option>
        </select>
        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
          <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
            <path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z" />
          </svg>
        </div>
      </div>

      <p class="text-[10px] text-gray-500 mt-3 italic">
        Drag to Rotate / Scroll to Zoom
      </p>
    </div>
  </div>

  <div id="app" class=""></div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
